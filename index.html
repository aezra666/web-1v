<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AezraPuissant</title>
    <link rel="icon" type="image/png" href="assets/rr.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
    <link rel="stylesheet" href="js/styles.css">
</head>
<body>

<video autoplay muted loop playsinline id="bg-video">
    <source src="assets/aezra.mp4" type="video/mp4">
</video>

<div id="enterxyz">
    <span>CLICK</span>
</div>

<audio id="bgmusic" loop>
    <source src="assets/Clara%20La%20San%20-%20Want%20U%20(Lyric%20Video).mp3" type="audio/mpeg">
</audio>

<div class="volume-control">
    <label for="volume-slider" id="volume-icon">
        <i class="fa-solid fa-volume-high"></i>
    </label>
    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
</div>

<div class="profile-container">
    <div class="profile-avatar">
        <a href="https://youtu.be/ToRqXvEfSCQ?t=7" target="_blank">
            <img id="discordAvatar" src="assets/rr.png" alt="Profile">
        </a>
        <span id="statusDot" class="status-dot"></span>
    </div>
    <div class="profile-username">
        <span id="discordUsername" class="gradient-text sparkle-overlay glitch" data-text="loading..."></span>
    </div>
    <h1 class="bx bx-microchip"></h1>
    <p id="stylesheet"></p>
    <div class="profile-links">
        <a href="https://discord.com/users/1034804876733071382" target="_blank"><i class="fa-brands fa-discord"></i></a>
        <a href="https://youtube.com/@Aezra999" target="_blank"><i class="fa-brands fa-youtube"></i></a>
        <a href="https://instagram.com/real.jzz" target="_blank"><i class="fa-brands fa-instagram"></i></a>
    </div>
    <div id="view-count">
        <i class="bx bx-world"></i>
        <span id="view-count-number">wait..</span>
    </div>
</div>

<script src="js/snowstorm.js"></script>
<script>
    snowStorm.flakesMax = 100;
    snowStorm.flakeWidth = 8;
    snowStorm.animationInterval = 33;
    snowStorm.flakesMaxActive = 100;
    snowStorm.snowColor = '#5865f2';
</script>

<script src="js/script.js"></script>

<script>
    const bgMusic = document.getElementById('bgmusic');
    const volumeSlider = document.getElementById('volume-slider');

    volumeSlider.addEventListener('input', function() {
        bgMusic.volume = this.value;
    });

    document.getElementById('enterxyz').addEventListener('click', function() {
        this.style.display = 'none';
        bgMusic.muted = false;
        bgMusic.play().catch(() => {});
    });
</script>

</body>
</html>
